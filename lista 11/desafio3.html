<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento</title>
</head>
<body>

    <h1> Estacionamento</h1>

    <form action="desafio3.php"method="POST">
        <label>Nome do motorista:</label><br>
        <input type="text" name="motorista" required>
        <br><br>

        <label>Tipo de veículo:</label><br>
        <select name="veiculo">
        <option value="moto">Moto</option>
        <option value="carro">Carro</option>
        <option value="caminhonete">Caminhonete</option>
        </select>
        <br><br>

        <label>Quantidade de horas estacionado:</label><br>
        <input type="number" name="horas" min="1" required>
        <br><br>

        <button type="submit">Calcular</button>
    </form>
    
</body>
</html>
